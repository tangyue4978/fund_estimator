name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt --strict --progress-spinner off
      - name: Compile
        run: python -m compileall -q app config datasources domain services storage tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Local deployment preflight
        run: python scripts/preflight.py
